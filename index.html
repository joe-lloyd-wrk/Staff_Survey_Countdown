<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NHS Staff Survey Countdown</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#ffffff;
}

.poster{
    position:relative;
    width:100%;
    max-width:1600px;
    margin:auto;
}

.poster img{
    width:100%;
    display:block;
}

.countdown-overlay{

    position:absolute;

    left:5%;
    top:68%;

    width:46%;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    text-align:center;
    color:white;
}

.counter{
    flex:1;
}

.counter span{
    display:block;
    font-size:4rem;
    font-weight:700;
    line-height:1;
    text-shadow:0 2px 6px rgba(0,0,0,0.3);
}

.counter label{
    display:block;
    margin-top:10px;
    font-size:1rem;
    font-weight:600;
    letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,0.3);
}

@media (max-width:1200px){

    .counter span{
        font-size:3rem;
    }

    .counter label{
        font-size:0.9rem;
    }
}

@media (max-width:800px){

    .countdown-overlay{
        top:69%;
        width:48%;
    }

    .counter span{
        font-size:2rem;
    }

    .counter label{
        font-size:0.7rem;
    }
}

</style>
</head>

<body>

<div class="poster">
 
Staff-Survey-Mock-up-V4.png
 
<div class="countdown-overlay">

        <div class="counter">
            <span id="days">00</span>
            <label>DAYS</label>
        </div>

        <div class="counter">
            <span id="hours">00</span>
            <label>HOURS</label>
        </div>

        <div class="counter">
            <span id="minutes">00</span>
            <label>MINUTES</label>
        </div>

        <div class="counter">
            <span id="seconds">00</span>
            <label>SECONDS</label>
        </div>

    </div>

</div>

<script>

const surveyEnd = new Date("2026-11-27T23:59:00+00:00");

function updateCountdown(){

    const now = new Date();
    const difference = surveyEnd - now;

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (difference % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (difference % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent =
        String(days);

    document.getElementById("hours").textContent =
        String(hours).padStart(2,'0');

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,'0');

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
