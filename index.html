<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Survey Countdown</title>

<style>

body{
    margin:0;
    background:#005EB8;
    color:white;
    font-family:'Segoe UI', sans-serif;
    text-align:center;
}

.banner{
    padding:30px;
}

h1{
    margin:0;
    font-size:2rem;
}

#countdown{
    font-size:3rem;
    font-weight:700;
    margin-top:15px;
}

.subtitle{
    font-size:1.2rem;
    margin-top:10px;
}
    .countdown-container{
    display:flex;
    justify-content:center;
    gap:0;
    margin-top:20px;
}

.box{
    border:1px solid white;
    min-width:90px;
    padding:15px 10px;
    text-align:center;
}

.box div:first-child{
    font-size:2rem;
    font-weight:bold;
    margin-bottom:8px;
}

.box div:last-child{
    font-size:1rem;
}

</style>

</head>
<body>

<div class="banner">

    <h1>🗣️ University Hospitals of Liverpool National NHS Staff Survey 2026</h1>

    <div class="subtitle">
        Time remaining to have your say
    </div>

    <div class="countdown-container">

    <div class="box">
        <div id="days">00</div>
        <div>DAYS</div>
    </div>

    <div class="box">
        <div id="hours">00</div>
        <div>HRS</div>
    </div>

    <div class="box">
        <div id="minutes">00</div>
        <div>MINS</div>
    </div>

    <div class="box">
        <div id="seconds">00</div>
        <div>SECS</div>
    </div>

</div>

</div>

<script>

const surveyEnd = new Date("2026-11-28T00:00:00+00:00");

function updateCountdown(){

    const now = new Date();
    const difference = surveyEnd - now;

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("days").textContent =
String(days);

document.getElementById("hours").textContent =
String(hours).padStart(2,'0');

document.getElementById("minutes").textContent =
String(minutes).padStart(2,'0');

document.getElementById("seconds").textContent =
String(seconds).padStart(2,'0');

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
