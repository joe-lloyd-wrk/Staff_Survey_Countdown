<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Survey Countdown</title>

<style>

body{
    margin:0;
    background:#005EB8;
    color:white;
    font-family:'Segoe UI', sans-serif;
    text-align:center;
}

.banner{
    padding:30px;
}

h1{
    margin:0;
    font-size:2rem;
}

#countdown{
    font-size:3rem;
    font-weight:700;
    margin-top:15px;
}

.subtitle{
    font-size:1.2rem;
    margin-top:10px;
}

</style>

</head>
<body>

<div class="banner">

    <h1>🗣️ University Hospitals of Liverpool National NHS Staff Survey 2026</h1>

    <div class="subtitle">
        Time remaining to have your say
    </div>

    <div id="countdown"></div>

</div>

<script>

const surveyEnd = new Date("2026-11-27T23:59:59");

function updateCountdown(){

    const now = new Date();
    const difference = surveyEnd - now;

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60 * 60 * 60)) / (1000 * 60 * 60));

    document.getElementById("countdown").innerHTML =
        `${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
