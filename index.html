<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NHS Staff Survey Countdown</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#ffffff;
}

.poster{
    position:relative;
    width:100%;
    max-width:1600px;
    margin:auto;
}

.poster img{
    width:100%;
    height:auto;
    display:block;
}

.countdown-overlay{

    position:absolute;

    left:4%;
    top:72%;
    width:48%;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    text-align:center;
    color:white;
}

.counter{
    flex:1;
}

.counter span{
    display:block;
    font-size:4rem;
    font-weight:700;
    line-height:1;
    text-shadow:0 2px 6px rgba(0,0,0,0.4);
}

.counter label{
    display:block;
    margin-top:8px;
    font-size:1rem;
    font-weight:600;
    letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,0.4);
}

@media (max-width:1200px){

    .counter span{
        font-size:3rem;
    }

    .counter label{
        font-size:0.8rem;
    }
}

@media (max-width:800px){

    .countdown-overlay{
        top:72%;
        width:50%;
    }

    .counter span{
        font-size:2rem;
    }

    .counter label{
        font-size:0.6rem;
    }
}

</style>
</head>

<body>

<div class="poster">

    <div class="poster">

    <img src="Staff-Survery-Mock-up-V4.png" alt="Staff Survey Overlay">

    <div class="countdown-overlay">

        <div class="counter">
            <span id="days">00</span>
            <label>DAYS</label>
        </div>

        <div class="counter">
            <span id="hours">00</span>
            <label>HOURS</label>
        </div>

        <div class="counter">
            <span id="minutes">00
